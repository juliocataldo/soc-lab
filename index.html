<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>SOC Hands-on - Console de Triagem</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2d3646;--tx:#e6edf3;--mut:#9aa7b8;--acc:#4da3ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--crit:#ff6b9d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;margin-right:auto}
header h1 small{color:var(--mut);font-weight:400;margin-left:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center;min-width:92px}
.kpi b{display:block;font-size:18px}.kpi span{color:var(--mut);font-size:11px}
input[type=text],select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
header input{width:200px}
button{background:var(--acc);color:#04111f;border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{display:grid;grid-template-columns:340px 1fr;gap:12px;padding:12px;min-height:calc(100vh - 64px)}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{flex:1;padding:5px}
.filters button.on{background:var(--acc);color:#04111f}
.card{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.card:hover,.card.sel{border-color:var(--acc)}
.card .t{font-weight:600;margin:2px 0}
.card .m{color:var(--mut);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.card.done{opacity:.7}
.s-Informativa{border-left-color:#6e7681}.s-Baixa{border-left-color:var(--ok)}.s-Média{border-left-color:var(--warn)}.s-Alta{border-left-color:var(--bad)}.s-Crítica{border-left-color:var(--crit)}
.chip{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
h2{font-size:17px;margin:0 0 4px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 Consolas,monospace;margin:0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
code{font-family:Consolas,monospace;word-break:break-all}
.enr{background:var(--panel2);border-left:3px solid var(--acc);padding:6px 10px;margin:4px 0 8px;font-size:13px}
.enr small{color:var(--mut);display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px}
legend{color:var(--mut);font-size:12px;padding:0 4px}
label.opt{display:block;padding:2px 0;cursor:pointer}
.fb{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;background:var(--panel2)}
.fb .r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.good{color:var(--ok)}.badc{color:var(--bad)}
.err{color:var(--bad);margin:6px 0}
.empty{color:var(--mut)}.empty li{margin:4px 0}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;max-width:760px;width:92vw;max-height:88vh;overflow:auto}
dialog::backdrop{background:#000a}
.tl div{padding:3px 0;border-bottom:1px dashed var(--line)}
.warn{background:#2a2410;border:1px solid var(--warn);border-radius:8px;padding:8px 10px;color:#f0d98a;font-size:13px}
</style>
</head>

/* ===== Estado e helpers ===== */
const S={sel:null,filter:'all',st:{},enr:new Set()}; // st[id]={ans,g}
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const k of kids.flat()){if(k!=null)e.append(k);}return e;}
function grade(a,ans){const r=a.ref;const v=ans.verdict===r.verdict,s=ans.sev===r.sev,t=ans.tech===r.tech,i=ans.inc===r.inc;
  const miss=r.must.filter(x=>!ans.actions.includes(x));const extra=ans.actions.filter(x=>!r.must.includes(x)&&!r.ok.includes(x));
  const ac=!miss.length&&!extra.length;return{v,s,t,i,ac,miss,extra,pts:[v,s,t,i,ac].filter(Boolean).length};}

/* ===== Lista ===== */
function renderList(){
  const box=$('#list');box.replaceChildren();
  for(const a of ALERTS){const d=!!S.st[a.id];
    if(S.filter==='new'&&d)continue;if(S.filter==='done'&&!d)continue;
    const c=h('div',{class:`card s-${a.sev}${d?' done':''}${S.sel===a.id?' sel':''}`,tabindex:'0',role:'button','aria-label':`${a.id} ${a.title}`,
      onclick:()=>select(a.id),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(a.id);}}},
      h('div',{class:'m'},h('b',null,a.id),a.time,a.src,h('span',{class:'chip'},a.sev),d?h('span',{class:'chip ok'},'triado'):null),
      h('div',{class:'t'},a.title));
    box.append(c);}
  const n=Object.keys(S.st).length;$('#kTri').textContent=`${n}/${ALERTS.length}`;
  $('#kVer').textContent=Object.values(S.st).filter(x=>x.g.v).length;$('#kEnr').textContent=S.enr.size;
}
function select(id){S.sel=id;renderList();renderDetail();}

/* ===== Detalhe ===== */
function renderDetail(){
  const box=$('#detail');box.replaceChildren();
  if(!S.sel){box.append(h('h2',null,'Bem-vindo ao turno'),
    h('p',{class:'empty'},'Você é o analista N1 de plantão da OrbitaPay (fintech fictícia). A fila tem 12 alertas. Para cada um:'),
    h('ol',{class:'empty'},h('li',null,'Leia a evidência e CONSULTE os IOCs (reputação simulada).'),h('li',null,'Decida: verdadeiro positivo, falso positivo ou inconclusivo.'),
      h('li',null,'Defina a severidade REAL (pode diferir da do sistema), a técnica ATT&CK, as ações e se o alerta faz parte de um incidente maior.'),h('li',null,'Registre a triagem para ver a análise de referência.')),
    h('p',{class:'empty'},'Dica: alguns alertas se conectam. Procure hosts, usuários, IPs e horários em comum. Todos os dados são fictícios.'));return;}
  const a=ALERTS.find(x=>x.id===S.sel);const done=S.st[a.id];
  box.append(h('h2',null,`${a.id} - ${a.title}`),
    h('div',{class:'m',style:'color:var(--mut)'},`${a.time} | ${a.src} | severidade do sistema: ${a.sev} | ${a.entity}`),
    h('p',null,a.summary),h('h3',null,'Evidência'),h('pre',null,a.log),h('h3',null,'IOCs (clique em Consultar)'));
  const tb=h('table',null,h('tr',null,h('th',null,'Tipo'),h('th',null,'Valor'),h('th',null,'')));
  a.iocs.forEach((o,i)=>{const key=`${a.id}:${i}`;const slot=h('div');
    const btn=h('button',{class:'sec',onclick:()=>{S.enr.add(key);slot.replaceChildren(h('div',{class:'enr'},o.r,h('small',null,'Fonte simulada para fins didáticos')));btn.disabled=true;$('#kEnr').textContent=S.enr.size;}},'Consultar');
    if(S.enr.has(key)){slot.append(h('div',{class:'enr'},o.r,h('small',null,'Fonte simulada para fins didáticos')));btn.disabled=true;}
    tb.append(h('tr',null,h('td',null,o.t),h('td',null,h('code',null,o.v),slot),h('td',null,btn)));});
  box.append(tb,h('h3',null,'Sua triagem'));
  box.append(buildForm(a,done));
  if(done)box.append(buildFeedback(a,done));
}
function buildForm(a,done){
  const A=done?done.ans:{};const dis=!!done;
  const f=h('form',{onsubmit:e=>e.preventDefault()});
  const radio=(name,val,txt,chk)=>h('label',{class:'opt'},h('input',{type:'radio',name,value:val,checked:chk?'':false,disabled:dis?'':false}),' '+txt);
  f.append(h('div',{class:'grid2'},
    h('fieldset',null,h('legend',null,'Veredito'),...Object.entries(VERD).map(([k,v])=>radio('verdict',k,v,A.verdict===k))),
    h('fieldset',null,h('legend',null,'Severidade real'),...SEVS.map(s=>radio('sev',s,s,A.sev===s)))));
  const sel=(id,opts,val)=>{const s=h('select',{id,disabled:dis?'':false},h('option',{value:''},'- selecione -'),...opts.map(([v,t])=>h('option',{value:v,selected:val===v?'':false},v==='NA'||v==='none'?t:(id==='tech'?`${v} - ${t}`:t))));return s;};
  f.append(h('div',{class:'grid2'},
    h('div',null,h('label',{for:'tech'},'Técnica MITRE ATT&CK'),sel('tech',TECHS,A.tech)),
    h('div',null,h('label',{for:'inc'},'Relação com outros alertas'),sel('inc',[['A','Faz parte de uma cadeia de ataque (Incidente A)'],['none','Evento isolado / sem relação']],A.inc))));
  f.append(h('fieldset',{style:'margin-top:10px'},h('legend',null,'Ações recomendadas'),...Object.entries(ACTIONS).map(([k,v])=>
    h('label',{class:'opt'},h('input',{type:'checkbox',name:'act',value:k,checked:A.actions&&A.actions.includes(k)?'':false,disabled:dis?'':false}),' '+v))));
  f.append(h('label',{for:'note'},'Justificativa (1-2 linhas)'),h('textarea',{id:'note',rows:'2',maxlength:'400',disabled:dis?'':false},A.note||''));
  const err=h('div',{class:'err',role:'alert'});
  f.append(err,h('button',{type:'button',disabled:dis?'':false,onclick:()=>{
    const ans={verdict:(f.querySelector('[name=verdict]:checked')||{}).value,sev:(f.querySelector('[name=sev]:checked')||{}).value,
      tech:f.querySelector('#tech').value,inc:f.querySelector('#inc').value,actions:[...f.querySelectorAll('[name=act]:checked')].map(x=>x.value),note:f.querySelector('#note').value.trim()};
    if(!ans.verdict||!ans.sev||!ans.tech||!ans.inc||!ans.actions.length){err.textContent='Preencha veredito, severidade, técnica, relação e ao menos uma ação.';return;}
    S.st[a.id]={ans,g:grade(a,ans)};renderList();renderDetail();}},'Registrar triagem'));
  return f;
}
function buildFeedback(a,d){
  const g=d.g,r=a.ref;const mk=(ok,t)=>h('span',{class:'chip '+(ok?'ok':''),style:ok?'':'color:var(--bad);border-color:var(--bad)'},(ok?'✔ ':'✘ ')+t);
  const fb=h('div',{class:'fb'},h('b',null,`Análise de referência (${g.pts}/5 pontos de aderência)`),
    h('div',{class:'r',style:'margin-top:6px'},mk(g.v,'Veredito'),mk(g.s,'Severidade'),mk(g.t,'Técnica'),mk(g.i,'Correlação'),mk(g.ac,'Ações')),
    h('p',null,h('b',null,'Esperado: '),`${VERD[r.verdict]} | ${r.sev} | ${r.tech==='NA'?'N/A':r.tech} | ${r.inc==='A'?'Incidente A':'isolado'}`),
    h('p',null,h('b',null,'Ações essenciais: '),r.must.map(x=>ACTIONS[x]).join('; ')+'.'),
    g.miss.length?h('p',{class:'badc'},'Faltou: '+g.miss.map(x=>ACTIONS[x]).join('; ')):null,
    g.extra.length?h('p',{class:'badc'},'Desnecessário/arriscado aqui: '+g.extra.map(x=>ACTIONS[x]).join('; ')):null,
    h('p',null,r.why));
  return fb;
}

/* ===== Debrief e relatório ===== */
function openDebrief(){
  const dlg=$('#dlg');dlg.replaceChildren();const done=Object.entries(S.st);
  const tot=done.reduce((s,[,x])=>s+x.g.pts,0);
  dlg.append(h('h2',null,'Debrief do turno'),h('p',null,`Triados: ${done.length}/${ALERTS.length} | Aderência: ${tot}/${done.length*5||0} pontos | Consultas a IOCs: ${S.enr.size}`));
  if(done.length<ALERTS.length)dlg.append(h('div',{class:'warn'},'Ainda há alertas pendentes. O debrief completo fica melhor depois de triar todos.'));
  const inc=ALERTS.filter(a=>a.ref.inc==='A');
  dlg.append(h('h3',null,'Incidente A - linha do tempo da cadeia de ataque'),
    h('div',{class:'tl'},...inc.map(a=>h('div',null,h('b',null,a.time+' '),`${a.id} - ${a.title}`))));
  dlg.append(h('h3',null,'Perguntas para discussão'),
    h('ol',null,h('li',null,'Em que alerta o incidente deveria ter sido contido? Quanto tempo entre o phishing (09:02) e a exfiltração (11:02)?'),
      h('li',null,'Se o WKS-FIN-07 fosse isolado às 09:44, o que teria sido evitado? (Janela: 78 min.)'),
      h('li',null,'Por que A-005, A-007 e A-011 são falsos positivos, e o que os distingue de A-004 (mesma "ferramenta suspeita", contexto diferente)?'),
      h('li',null,'A-009 não tem relação com o Incidente A. Como priorizar dois incidentes críticos ao mesmo tempo?'),
      h('li',null,'Quais controles preventivos teriam impedido a cadeia? (DMARC estrito, bloquear macros, desabilitar legacy auth, MFA resistente a phishing, DLP com bloqueio.)'),
      h('li',null,'Qual IOC é mais fácil para o atacante trocar (hash, IP, domínio) e qual é mais caro (TTP)?')));
  dlg.append(h('div',{style:'margin-top:14px;display:flex;gap:8px'},h('button',{class:'sec',onclick:()=>dlg.close()},'Fechar')));
  dlg.showModal();
}
function buildReport(){
  const who=$('#analyst').value.trim()||'(não informado)';
  let m=`# Relatório de triagem - SOC Hands-on\n\nAnalista: ${who}\nData: 06/10/2026\n\n`;
  for(const a of ALERTS){const d=S.st[a.id];m+=`## ${a.id} - ${a.title}\n`;
    if(!d){m+='- Não triado\n\n';continue;}
    const x=d.ans;m+=`- Veredito: ${VERD[x.verdict]}\n- Severidade: ${x.sev} (sistema: ${a.sev})\n- Técnica: ${x.tech}\n- Incidente: ${x.inc==='A'?'A':'isolado'}\n- Ações: ${x.actions.map(k=>ACTIONS[k]).join('; ')}\n- Justificativa: ${x.note||'-'}\n\n`;}
  return m;
}
function downloadReport(){
  const b=new Blob([buildReport()],{type:'text/markdown'});const u=URL.createObjectURL(b);
  const l=h('a',{href:u,download:'relatorio-soc.md'});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ===== Eventos ===== */
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{S.filter=b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x=>{x.classList.toggle('on',x===b);x.classList.toggle('sec',x!==b);});renderList();}));
$('#bDeb').addEventListener('click',openDebrief);
$('#bRep').addEventListener('click',downloadReport);
$('#bRst').addEventListener('click',()=>{if(confirm('Reiniciar o turno? Todas as triagens serão apagadas.')){S.sel=null;S.st={};S.enr=new Set();renderList();renderDetail();}});
renderList();renderDetail();
</script>
</body>
