<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SOC Hands-on 2 - Mini-SIEM</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2d3646;--tx:#e6edf3;--mut:#9aa7b8;--acc:#4da3ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;margin-right:auto}header h1 small{color:var(--mut);font-weight:400;margin-left:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center;min-width:88px}
.kpi b{display:block;font-size:18px}.kpi span{color:var(--mut);font-size:11px}
input[type=text],input[type=time],input[type=number],select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
header input{width:190px}
button{background:var(--acc);color:#04111f;border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.pv:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
nav button{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
nav button.on{background:var(--panel);color:var(--tx);border-color:var(--acc)}
main{padding:0 12px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:12px}
h2{font-size:17px;margin:0 0 4px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
p.lead{color:var(--mut);margin:0 0 10px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}details ul{margin:6px 0 2px;padding-left:18px}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:860px){.bar{grid-template-columns:1fr 1fr}}
.bar label{font-size:11px;color:var(--mut);display:block}
.tw{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:5px 6px;color:var(--mut);font-weight:500;white-space:nowrap}
td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:top}
td.m{font-family:Consolas,monospace;word-break:break-word}
td.pv{color:var(--acc);cursor:pointer;white-space:nowrap}td.pv:hover{text-decoration:underline}
tr.fl{background:#3a2a0a}
.fb{background:none;border:1px solid var(--line);color:var(--mut);padding:0 6px;border-radius:4px;font-weight:400}
tr.fl .fb{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.card pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
label.opt{display:block;padding:2px 0;cursor:pointer}
.chip{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.no{color:var(--bad);border-color:var(--bad)}
.res{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:var(--panel2)}
.good{color:var(--ok)}.badc{color:var(--bad)}.mut{color:var(--mut)}
.err{color:var(--bad);margin:6px 0}
.cond{display:grid;grid-template-columns:1fr 1fr 2fr;gap:6px;margin-bottom:6px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:10px}
.chs label{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--panel2);display:block}
.chs label.on{border-color:var(--acc)}
.warn{background:#2a2410;border:1px solid var(--warn);border-radius:8px;padding:8px 10px;color:#f0d98a;font-size:13px;margin-bottom:8px}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;max-width:760px;width:92vw;max-height:88vh;overflow:auto}
dialog::backdrop{background:#000a}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px}legend{color:var(--mut);font-size:12px;padding:0 4px}
</style>

/* ===== Parte 2: veredito ===== */
function storyOf(e){return STORY_OF[e.l]||'noise';}
function verdict(v){
  v.append(h('h2',null,'Parte 2 - Incidente real ou falso positivo?'),
    h('p',{class:'lead'},'Seus eventos sinalizados foram agrupados por correlação (como um SIEM faria). Para cada grupo, decida e justifique. Use a Base de contexto da Parte 1.'));
  const groups={};for(const id of S.flags){const e=EV[id-1];(groups[storyOf(e)]=groups[storyOf(e)]||[]).push(e);}
  const keys=Object.keys(groups);
  if(!keys.length)v.append(h('div',{class:'warn'},'Você ainda não sinalizou nenhum evento. Volte à Parte 1 e marque os suspeitos com 🚩.'));
  keys.forEach((k,idx)=>{const ev=groups[k].sort((a,b)=>a.t-b.t);const done=S.cases[k];
    const hosts=[...new Set(ev.map(e=>e.h))].join(', '),users=[...new Set(ev.map(e=>e.u).filter(Boolean))].join(', ')||'-';
    const card=h('div',{class:'card'},h('b',null,`Achado ${idx+1}: ${ev.length} evento(s) | ${hosts} | ${users} | ${fmt(ev[0].t)}-${fmt(ev[ev.length-1].t)}`),
      h('pre',null,ev.slice(0,6).map(e=>`${fmt(e.t)} [${e.s}] ${e.h} ${e.u||'-'} ${e.a}->${e.d||'-'} ${e.x} ${e.m}`).join('\n')+(ev.length>6?`\n... +${ev.length-6} evento(s)`:'')));
    const name='v_'+k;const dis=!!done;
    card.append(h('label',{class:'opt'},h('input',{type:'radio',name,value:'real',checked:done&&done.v==='real'?'':false,disabled:dis?'':false}),' Incidente real (verdadeiro positivo)'),
      h('label',{class:'opt'},h('input',{type:'radio',name,value:'fp',checked:done&&done.v==='fp'?'':false,disabled:dis?'':false}),' Falso positivo / atividade legítima'));
    const note=h('textarea',{rows:'2',maxlength:'400',placeholder:'Justificativa: que evidência (ou contexto) sustenta o seu veredito?',disabled:dis?'':false},done?done.note:'');
    const err=h('div',{class:'err',role:'alert'});
    card.append(note,err,h('button',{disabled:dis?'':false,onclick:()=>{const c=card.querySelector(`[name=${name}]:checked`);if(!c){err.textContent='Escolha um veredito.';return;}
      S.cases[k]={v:c.value,note:note.value.trim(),n:ev.length};render();}},'Registrar'));
    if(done){const st=STORIES[k];const ok=(done.v==='real')===st.real;
      card.append(h('div',{class:'res'},h('span',{class:'chip '+(ok?'ok':'no')},ok?'✔ Veredito correto':'✘ Veredito diferente do esperado'),' ',h('b',null,st.real?'Esperado: incidente real':'Esperado: falso positivo / legítimo'),h('p',null,st.why)));}
    v.append(card);});
  v.append(h('button',{class:'sec',onclick:()=>{S.cov=!S.cov;render();}},S.cov?'Ocultar cobertura':'Ver cobertura da caça'));
  if(S.cov){const atk=EV.filter(e=>ATTACK_TAGS.includes(e.l));const hit=atk.filter(e=>S.flags.has(e.i));const flagged=[...S.flags];const fp=flagged.filter(i=>!ATTACK_TAGS.includes(EV[i-1].l));
    const box=h('div',{class:'res'},h('b',null,'Cobertura da caça'),h('p',null,`Indícios de intrusão encontrados: ${hit.length}/${atk.length}. Sinalizados que NÃO eram intrusão: ${fp.length} de ${flagged.length}.`));
    const lines=SEV_STORY.map(k=>{const all=atk.filter(e=>STORY_OF[e.l]===k);const got=all.filter(e=>S.flags.has(e.i)).length;return{k,all:all.length,got};});
    box.append(h('ul',null,...lines.map(l=>h('li',{class:l.got===l.all?'good':l.got?'':'badc'},`${l.got}/${l.all} - ${STORIES[l.k].hint}`))));
    box.append(h('p',{class:'mut'},'Linhas em vermelho indicam pontos cegos: volte à Parte 1 e procure por esses padrões.'));v.append(box);}
}

/* ===== Parte 3: engenharia de detecção ===== */
const FIELDS=[['action','ação'],['detail','detalhe'],['user','usuário'],['host','host'],['srcip','origem'],['dstip','destino'],['src','fonte']];
const OPS=[['has','contém'],['eq','é igual a'],['not','NÃO contém']];
function detect(v){

    h('p',{class:'lead'},'Agora que você achou a intrusão na mão, escreva regras que a encontrem automaticamente. Uma boa regra pega o ataque (recall) sem gerar alertas falsos (precisão). Teste e ajuste.'));

  v.append(chs);
  const C=CHAL.find(c=>c.id===S.ch);const R=S.rule[C.id]||(S.rule[C.id]={conds:[{f:'action',op:'eq',v:''},{f:'detail',op:'has',v:''},{f:'srcip',op:'not',v:''}],n:1,win:10,by:'none',res:null});
  v.append(h('div',{class:'mut'},'Critério de aprovação: '+C.pass));
  const cond=h('div',{style:'margin-top:8px'});

    h('select',{'aria-label':'Campo',onchange:e=>{c.f=e.target.value;}},...FIELDS.map(([a,b])=>h('option',{value:a,selected:c.f===a?'':false},b))),

  const n=h('input',{type:'number',min:'1',max:'200',value:R.n,'aria-label':'Limiar N',oninput:e=>{R.n=+e.target.value;}});
  const win=h('input',{type:'number',min:'1',max:'720',value:R.win,'aria-label':'Janela em minutos',oninput:e=>{R.win=+e.target.value;}});
  const by=h('select',{'aria-label':'Agrupar por',onchange:e=>{R.by=e.target.value;}},h('option',{value:'none',selected:R.by==='none'?'':false},'ninguém (global)'),...FIELDS.filter(f=>['user','host','srcip','dstip'].includes(f[0])).map(([a,b])=>h('option',{value:a,selected:R.by===a?'':false},b)));
  const err=h('div',{class:'err',role:'alert'});const out=h('div');
  v.append(h('fieldset',null,h('legend',null,'Condições (todas devem ser verdadeiras)'),cond),
    h('fieldset',null,h('legend',null,'Limiar: alertar se houver pelo menos N eventos na janela (N=1 desativa o limiar)'),h('div',{class:'grid2'},h('div',null,h('label',null,'N (eventos)'),n,h('label',null,'Janela (minutos)'),win),h('div',null,h('label',null,'Contar separadamente por'),by))),
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},h('button',{onclick:run},'Testar regra'),
      h('button',{class:'sec',onclick:()=>{if(S.hints[C.id]<C.hints.length){S.hints[C.id]++;render();}},disabled:S.hints[C.id]>=C.hints.length?'':false},`Dica (${S.hints[C.id]}/${C.hints.length})`)),err,out);
  if(S.hints[C.id])v.append(h('div',{class:'res'},h('b',null,'Dicas: '),...C.hints.slice(0,S.hints[C.id]).map(t=>h('div',null,'- '+t))));

    const m=evalRule(EV,rule);const mt=metrics(EV,m,C.tag);const pass=C.ok(mt);if(pass)S.passed.add(C.id);

  function show(r){const mt=r.mt;const names={f_scan:'varredura do scanner autorizado',f_pwexp:'troca de senha em lote',f_backup:'jobs de conta de serviço/backup legítimos',f_batch:'jobs de conta de serviço legítimos',f_admin:'admin legítimo no jump host',ruido:'eventos de rotina'};

      h('pre',{style:'background:var(--bg);padding:8px;border-radius:6px;overflow:auto;font-size:12px;white-space:pre-wrap'},r.sample.join('\n')+(mt.matched>12?`\n... +${mt.matched-12}`:''))));}

    h('div',{style:'margin-top:12px'},h('button',{class:'sec',onclick:()=>d.close()},'Fechar')));d.showModal();}
function report(){const who=$('#analyst').value.trim()||'(não informado)';
  let m=`# Relatório - SOC Hands-on 2 (Mini-SIEM)\n\nAnalista: ${who}\nData: 07/10/2026\n\n## Caça\nEventos sinalizados: ${S.flags.size}\n\n## Veredito por achado\n`;
  Object.entries(S.cases).forEach(([k,c],i)=>{m+=`- Achado ${i+1} (${c.n} eventos): ${c.v==='real'?'Incidente real':'Falso positivo'} - ${c.note||'-'}\n`;});
  m+='\n## Regras de detecção\n';CHAL.forEach(c=>{const R=S.rule[c.id];const conds=R?R.conds.filter(x=>String(x.v||'').trim()).map(x=>`${x.f} ${x.op} "${x.v}"`).join(' E '):'-';
    m+=`- ${c.title}: ${S.passed.has(c.id)?'aprovada':'não aprovada'}${R?` | ${conds} | N=${R.n}, janela=${R.win}min, por=${R.by}`:''}\n`;});
  if(S.ir)m+='\n## Resposta\nRegistrada (cronologia, escopo e fases).\n';
  const b=new Blob([m],{type:'text/markdown'});const u=URL.createObjectURL(b);const l=h('a',{href:u,download:'relatorio-siem.md'});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('#bDeb').addEventListener('click',debrief);$('#bRep').addEventListener('click',report);
$('#bRst').addEventListener('click',()=>{if(confirm('Reiniciar? Todo o progresso será apagado.')){fresh();render();}});
render();
</script>
